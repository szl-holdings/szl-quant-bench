[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "szl-quant-bench"
version = "0.2.1"
description = "Honest quantization quality-curve bench: cosine/KL/top-1 degradation vs bit-width, hash-chained receipts. Fail closed."
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
license = {text = "Apache-2.0"}

[project.urls]
Homepage = "https://github.com/szl-holdings/szl-quant-bench"
Source = "https://github.com/szl-holdings/szl-quant-bench"
Issues = "https://github.com/szl-holdings/szl-quant-bench/issues"
Changelog = "https://github.com/szl-holdings/szl-quant-bench/releases"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.szl.release]
import_names = ["szl_quant_bench"] # wheel top-level import names; the release gate fails if the built wheel differs
