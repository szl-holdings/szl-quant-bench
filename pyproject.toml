[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "szl-quant-bench"
version = "0.1.0"
description = "Honest quantization quality-curve bench: cosine/KL/top-1 degradation vs bit-width, hash-chained receipts. Fail closed."
requires-python = ">=3.11"
license = {text = "Apache-2.0"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
